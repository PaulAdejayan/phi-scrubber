<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6c7086"/>
    </marker>
    <filter id="card" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="980" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="490" y="36" text-anchor="middle" fill="#1e293b" font-weight="700" font-size="18">phi-scrubber pipeline</text>
  <text x="490" y="56" text-anchor="middle" fill="#64748b" font-size="12">clinical text → scrubbed text + audit log</text>

  <!-- Input -->
  <rect x="20" y="100" width="150" height="60" rx="8" fill="#fff" stroke="#cbd5e1" filter="url(#card)"/>
  <text x="95" y="125" text-anchor="middle" fill="#0f172a" font-weight="600">clinical note</text>
  <text x="95" y="143" text-anchor="middle" fill="#64748b" font-size="11">.txt or FHIR DocumentReference</text>

  <!-- Detector lane -->
  <rect x="220" y="80" width="220" height="290" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-dasharray="4,3"/>
  <text x="330" y="100" text-anchor="middle" fill="#1e40af" font-weight="700">Detectors</text>

  <rect x="240" y="115" width="180" height="46" rx="6" fill="#fff" stroke="#bfdbfe" filter="url(#card)"/>
  <text x="330" y="135" text-anchor="middle" fill="#1e293b" font-weight="600">regex detectors</text>
  <text x="330" y="151" text-anchor="middle" fill="#64748b" font-size="11">phone, email, SSN, MRN, dates …</text>

  <rect x="240" y="173" width="180" height="46" rx="6" fill="#fff" stroke="#bfdbfe" filter="url(#card)"/>
  <text x="330" y="193" text-anchor="middle" fill="#1e293b" font-weight="600">spaCy NER</text>
  <text x="330" y="209" text-anchor="middle" fill="#64748b" font-size="11">PERSON · ORG · GPE · graceful fallback</text>

  <rect x="240" y="231" width="180" height="46" rx="6" fill="#fff" stroke="#bfdbfe" filter="url(#card)"/>
  <text x="330" y="251" text-anchor="middle" fill="#1e293b" font-weight="600">gazetteer</text>
  <text x="330" y="267" text-anchor="middle" fill="#64748b" font-size="11">hospitals + city-state seed list</text>

  <text x="330" y="305" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">each emits</text>
  <text x="330" y="320" text-anchor="middle" fill="#1e293b" font-family="'SF Mono','Cascadia Code',monospace" font-size="11">(start, end, category, confidence)</text>
  <text x="330" y="350" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">spans</text>

  <!-- Merge -->
  <rect x="475" y="160" width="170" height="60" rx="8" fill="#fff" stroke="#cbd5e1" filter="url(#card)"/>
  <text x="560" y="183" text-anchor="middle" fill="#0f172a" font-weight="600">span merge</text>
  <text x="560" y="200" text-anchor="middle" fill="#64748b" font-size="11">longest-match wins;</text>
  <text x="560" y="214" text-anchor="middle" fill="#64748b" font-size="11">category priority tiebreak</text>

  <!-- Tag assigner -->
  <rect x="475" y="250" width="170" height="60" rx="8" fill="#fff" stroke="#cbd5e1" filter="url(#card)"/>
  <text x="560" y="273" text-anchor="middle" fill="#0f172a" font-weight="600">tag assigner</text>
  <text x="560" y="290" text-anchor="middle" fill="#64748b" font-size="11">per-doc consistency;</text>
  <text x="560" y="304" text-anchor="middle" fill="#64748b" font-size="11">PATIENT_1 / DOCTOR_1 / …</text>

  <!-- Date shifter -->
  <rect x="475" y="65" width="170" height="60" rx="8" fill="#fef3c7" stroke="#fcd34d" filter="url(#card)"/>
  <text x="560" y="88" text-anchor="middle" fill="#0f172a" font-weight="600">date shifter</text>
  <text x="560" y="105" text-anchor="middle" fill="#64748b" font-size="11">SHA-256(patient_id) → ±180d</text>
  <text x="560" y="119" text-anchor="middle" fill="#64748b" font-size="11">intervals preserved</text>

  <!-- Apply -->
  <rect x="690" y="160" width="170" height="60" rx="8" fill="#fff" stroke="#cbd5e1" filter="url(#card)"/>
  <text x="775" y="183" text-anchor="middle" fill="#0f172a" font-weight="600">apply right-to-left</text>
  <text x="775" y="200" text-anchor="middle" fill="#64748b" font-size="11">offsets stay valid</text>
  <text x="775" y="214" text-anchor="middle" fill="#64748b" font-size="11">across replacements</text>

  <!-- Outputs -->
  <rect x="690" y="65" width="170" height="60" rx="8" fill="#dcfce7" stroke="#86efac" filter="url(#card)"/>
  <text x="775" y="88" text-anchor="middle" fill="#0f172a" font-weight="600">scrubbed text</text>
  <text x="775" y="105" text-anchor="middle" fill="#64748b" font-size="11">stdout or -o output.txt</text>

  <rect x="690" y="250" width="170" height="60" rx="8" fill="#dcfce7" stroke="#86efac" filter="url(#card)"/>
  <text x="775" y="273" text-anchor="middle" fill="#0f172a" font-weight="600">audit JSON</text>
  <text x="775" y="290" text-anchor="middle" fill="#64748b" font-size="11">--audit audit.json</text>
  <text x="775" y="304" text-anchor="middle" fill="#64748b" font-size="11">never publish alongside</text>

  <!-- Arrows -->
  <line x1="170" y1="130" x2="240" y2="138" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="130" x2="240" y2="196" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="130" x2="240" y2="254" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="425" y1="190" x2="475" y2="190" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="220" x2="560" y2="250" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="645" y1="280" x2="690" y2="190" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="645" y1="190" x2="690" y2="190" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="645" y1="95" x2="690" y2="95" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="775" y1="220" x2="775" y2="250" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="775" y1="160" x2="775" y2="125" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="490" y="430" text-anchor="middle" fill="#64748b" font-size="11">HIPAA Safe Harbor §164.514(b)(2) · regex + NER hybrid · MIT licensed</text>
  <text x="490" y="450" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">Not sufficient as sole de-identification control · human reviewer still required</text>
</svg>
