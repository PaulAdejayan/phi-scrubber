name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check phi_scrubber tests

      - name: Run tests (regex-only mode — no spaCy install)
        run: pytest -v

  test-with-ner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install with NER extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ner]"
          python -m spacy download en_core_web_sm

      - name: Run full test suite
        # NER tests will use en_core_web_sm; integration tests still pass
        env:
          PHI_SCRUBBER_NER_MODEL: en_core_web_sm
        run: pytest -v
